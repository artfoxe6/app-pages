        <a href="?lang=ko" data-language="ko" aria-label="한국어"><span class="language-full">한국어</span><span class="language-short">한</span></a>

    <main>
      <section class="hero app-hero" aria-labelledby="page-title">
        <div class="app-hero-copy">
          <p class="eyebrow" data-i18n="home.eyebrow">每一秒，清晰可见</p>
          <h1 id="page-title" data-i18n="home.heading">分秒</h1>

          <div class="app-links">

          <span>20</span><i>:</i><span>00</span>
