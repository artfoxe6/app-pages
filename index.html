<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="多个应用共用的产品说明、政策协议与支持信息中心。">
    <meta name="color-scheme" content="light dark">
    <title>App Pages · 产品文档与支持</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="App Pages 首页">
        <span class="brand-mark" aria-hidden="true">AP</span>
        <span>App Pages</span>
      </a>
      <span class="header-note">产品文档与支持</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">APP PAGE CENTER</p>
        <h1 id="page-title">需要的信息，<br>都在这里。</h1>
        <p class="lead">这里集中提供旗下应用的使用说明、常见问题、政策协议与支持信息。</p>
        <a class="text-link" href="#documents">查看文档 <span aria-hidden="true">↓</span></a>
      </section>

      <section class="documents" id="documents" aria-labelledby="documents-title">
        <div class="section-heading">
          <p class="eyebrow">DOCUMENTS</p>
          <h2 id="documents-title">应用页面</h2>
        </div>

        <!-- 发布首个应用时，用应用文档链接替换下面的空状态。 -->
        <div class="empty-state">
          <p>内容正在准备中</p>
          <span>正式发布后，可在这里按应用查看使用说明、政策协议与支持内容。</span>
        </div>
      </section>
    </main>

    <footer>
      <span>App Pages</span>
      <span>Last updated: 2026</span>
    </footer>
  </body>
</html>
